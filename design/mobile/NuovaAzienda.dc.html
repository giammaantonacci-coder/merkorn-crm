<!doctype html>
<html>
<head>

  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">

    a { color: #7B2FE0; } a:hover { color: #6721C4; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FFFFFF; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 28px 22px 12px;">
    <div style="font-size: 15px; font-weight: 600; color: #6C6C74;">Annulla</div>
    <div style="width: 36px; height: 36px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(22, 22, 26, 0.04), 0 6px 18px rgba(22, 22, 26, 0.07);">
      <svg viewBox="0 0 24 24" fill="none" stroke="#16161A" stroke-width="2" style="width: 17px; height: 17px;">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 11v5.5M12 7.5v.5" stroke-linecap="round"></path>
      </svg>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 0 16px;">

    <div style="padding: 4px 6px 6px;">
      <div style="font-size: 27px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.12; color: #16161A;">Nuova azienda</div>
      <div style="font-size: 14px; color: #6C6C74; margin-top: 7px; line-height: 1.45;">Bastano nome e settore. Il resto si aggiunge quando serve.</div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(22, 22, 26, 0.04), 0 6px 18px rgba(22, 22, 26, 0.07);">
      <div style="background: #F6F6F4; border-radius: 15px; padding: 12px 16px; display: flex; flex-direction: column; gap: 3px;">
        <label style="font-size: 12px; font-weight: 600; color: #6C6C74;">Ragione sociale</label>
        <div style="font-size: 16px; color: #16161A;">Trasporti Bevi S.r.l.</div>
      </div>
      <div style="background: #F6F6F4; border-radius: 15px; padding: 12px 16px; display: flex; flex-direction: column; gap: 3px;">
        <label style="font-size: 12px; font-weight: 600; color: #6C6C74;">Partita IVA</label>
        <div style="font-size: 16px; color: #B4B4BA;">11 cifre</div>
      </div>
      <div style="background: #F6F6F4; border-radius: 15px; padding: 12px 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <label style="font-size: 12px; font-weight: 600; color: #6C6C74;">Settore</label>
          <div style="font-size: 16px; color: #16161A;">Trasporti e logistica</div>
        </div>
        <svg viewBox="0 0 24 24" fill="none" stroke="#6C6C74" stroke-width="2" style="width: 18px; height: 18px; margin-bottom: 3px;">
          <path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 20px; box-shadow: 0 1px 2px rgba(22, 22, 26, 0.04), 0 6px 18px rgba(22, 22, 26, 0.07);">
      <div style="font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: #16161A; margin-bottom: 5px;">Come è arrivata</div>
      <div style="font-size: 13px; color: #6C6C74; margin-bottom: 14px;">Serve a capire quale canale porta i clienti migliori</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <div style="font-size: 14px; font-weight: 700; color: #FFFFFF; background: #9747FF; border-radius: 999px; padding: 11px 18px;">Passaparola</div>
        <div style="font-size: 14px; font-weight: 600; color: #16161A; background: #F6F6F4; border-radius: 999px; padding: 11px 18px;">Fiera</div>
        <div style="font-size: 14px; font-weight: 600; color: #16161A; background: #F6F6F4; border-radius: 999px; padding: 11px 18px;">Sito web</div>
        <div style="font-size: 14px; font-weight: 600; color: #16161A; background: #F6F6F4; border-radius: 999px; padding: 11px 18px;">Contatto diretto</div>
      </div>
    </div>

  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 30px;">
    <div style="height: 54px; border-radius: 27px; background: #9747FF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Salva e apri una trattativa</div>
    <div style="text-align: center; font-size: 14px; font-weight: 600; color: #6C6C74;">Salva soltanto l'azienda</div>
