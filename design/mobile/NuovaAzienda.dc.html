<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; }
    a { color: #7B2FE0; } a:hover { color: #6721C4; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FFFFFF; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 26px 20px 18px;">
    <div style="font-size: 15.5px; font-weight: 600; color: #6E6880;">Annulla</div>
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em; color: #14111C;">Nuova azienda</div>
    <div style="font-size: 15.5px; font-weight: 700; color: #CFC8DC;">Salva</div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 22px; padding: 6px 20px 0;">

    <div style="display: flex; flex-direction: column; gap: 13px;">
      <div style="font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6E6880;">Identità</div>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <label style="font-size: 13.5px; font-weight: 600; color: #3A3547;">Ragione sociale</label>
        <div style="height: 52px; border: 1.5px solid #9747FF; border-radius: 14px; display: flex; align-items: center; padding: 0 16px; font-size: 16px; color: #14111C;">Trasporti Bevi S.r.l.</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <label style="font-size: 13.5px; font-weight: 600; color: #3A3547;">Partita IVA</label>
        <div style="height: 52px; border: 1.5px solid #E5E1EC; border-radius: 14px; display: flex; align-items: center; padding: 0 16px; font-size: 16px; color: #CFC8DC;">11 cifre</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 13px;">
      <div style="font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6E6880;">Classificazione</div>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <label style="font-size: 13.5px; font-weight: 600; color: #3A3547;">Settore</label>
        <div style="height: 52px; border: 1.5px solid #E5E1EC; border-radius: 14px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
          <span style="font-size: 16px; color: #14111C;">Trasporti e logistica</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="#6E6880" stroke-width="2" style="width: 19px; height: 19px;">
            <path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 9px;">
        <label style="font-size: 13.5px; font-weight: 600; color: #3A3547;">Come è arrivata</label>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <div style="font-size: 14px; font-weight: 600; color: #FFFFFF; background: #9747FF; border-radius: 999px; padding: 10px 17px;">Passaparola</div>
          <div style="font-size: 14px; font-weight: 600; color: #3A3547; border: 1.5px solid #E5E1EC; border-radius: 999px; padding: 9px 16px;">Fiera</div>
          <div style="font-size: 14px; font-weight: 600; color: #3A3547; border: 1.5px solid #E5E1EC; border-radius: 999px; padding: 9px 16px;">Sito web</div>
          <div style="font-size: 14px; font-weight: 600; color: #3A3547; border: 1.5px solid #E5E1EC; border-radius: 999px; padding: 9px 16px;">Contatto diretto</div>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #F3EBFF; border-radius: 16px; padding: 15px 17px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7B2FE0" stroke-width="2" style="width: 21px; height: 21px; flex: none;">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 11v5.5M12 7.5v.5" stroke-linecap="round"></path>
      </svg>
      <div style="font-size: 13.5px; color: #3A3547; line-height: 1.45;">Il resto dei dati si aggiunge dopo. Ora serve solo poterla trovare.</div>
    </div>

  </div>

  <div style="padding: 16px 20px 30px;">
    <div style="height: 54px; border-radius: 27px; background: #9747FF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16.5px; font-weight: 700;">Salva e apri una trattativa</div>
  </div>

</div>
</x-dc>
</body>
</html>
